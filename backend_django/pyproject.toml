[project]
name = "adare-server"
version = "0.1.0"
description = "ADARE experiment management backend"
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2,<5",
    "Pillow",
    "djangorestframework",
    "django-filter",
    "django-cors-headers",
    "sorl-thumbnail",
    "python-decouple",
    "gunicorn",
    "psycopg2-binary",
    "django-rest-knox",
    "django-redis",
    "django-csp",
    "PyYAML",
    "dj-rest-auth",
    "django-allauth[socialaccount]",
    "requests",
    "celery",
    "django-storages",
    "boto3",
    "redis",
    "flower",
    "attrs",
    "tqdm",
    "cattrs",
    "python-ulid",
    "six~=1.17.0",
    "certifi~=2024.12.14",
    "urllib3~=2.3.0",
    "giteapy",
]

[tool.uv.sources]
giteapy = { git = "https://github.com/dblueai/giteapy.git" }

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "factory-boy>=3.3",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "adare.settings.development"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "slow: tests that take more than 5 seconds",
]
addopts = "-v --tb=short --strict-markers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
